# 把一木记账工具加到另一个已有模式的示例。
#
# 本包自带的 bundle patch 已经插入「记账模式」（preset-yimu-bill，标准模式复制
# + yimu-bill-tools），通常不需要再用这个文件。
#
# 用途：想额外把工具加到某个已有模式时，把下面这段追加到
#   $DSH_HOME/profiles/<profile>/cordis.patch.yml
# 并把 `preset-standard` / `standard` 换成目标模式的 patch id 与预设 id。
#
# 注意：profile 补丁是按行 id 覆盖整份 config 的，所以这里要给出该模式的
# 完整 plugins 列表（可从 DSH 源码的 presets/*.patch.yml 复制），只在末尾多
# 一行 yimu-bill-tools。DSH 升级标准模式后，这份覆写不会自动同步。

- insert:
    - id: preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        order: 1
        plugins:
          # ……这里放该模式原本的 plugins 行……
          - id: yimu-bill-tools
            name: dsh-yimu-bill/tools
            config:
              toolPrefix: yimu_
